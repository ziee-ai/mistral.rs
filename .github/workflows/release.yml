name: Build and Release mistralrs-server Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.7.0)'
        required: true
        type: string
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
      backend:
        description: 'Backend to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - cpu
          - metal
          - cuda

jobs:
  build-matrix:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.backend }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - CPU only (CUDA handled in separate build-cuda job)
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            backend: cpu
            target: x86_64-unknown-linux-gnu

          # macOS aarch64 - Metal (combined with CPU)
          - os: macos-14  # M1 runner
            platform: macos
            arch: aarch64
            backend: metal
            target: aarch64-apple-darwin
            features: metal

          # Windows x86_64 - CPU, CUDA (12 + 13)
          - os: windows-2022
            platform: windows
            arch: x86_64
            backend: cpu
            target: x86_64-pc-windows-msvc
          - os: windows-2022
            platform: windows
            arch: x86_64
            backend: cuda
            target: x86_64-pc-windows-msvc
            cuda_version: "12.6.0"
            version_suffix: "12.6"
            features: cuda
          - os: windows-2022
            platform: windows
            arch: x86_64
            backend: cuda
            target: x86_64-pc-windows-msvc
            cuda_version: "13.0.0"
            version_suffix: "13.0"
            features: cuda

    steps:
      # Check if this matrix entry should run based on filters
      - name: Check build filter
        id: filter
        shell: bash
        run: |
          PLATFORM_MATCH="false"
          BACKEND_MATCH="false"

          # Platform filter
          if [ "${{ inputs.platform }}" == "all" ] || [ "${{ inputs.platform }}" == "" ] || [ "${{ inputs.platform }}" == "${{ matrix.platform }}" ]; then
            PLATFORM_MATCH="true"
          fi

          # Backend filter
          if [ "${{ inputs.backend }}" == "all" ] || [ "${{ inputs.backend }}" == "" ] || [ "${{ inputs.backend }}" == "${{ matrix.backend }}" ]; then
            BACKEND_MATCH="true"
          fi

          if [ "$PLATFORM_MATCH" == "true" ] && [ "$BACKEND_MATCH" == "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Build will run: platform=${{ matrix.platform }}, backend=${{ matrix.backend }}"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping: platform=${{ matrix.platform }}, backend=${{ matrix.backend }} (filter: platform=${{ inputs.platform }}, backend=${{ inputs.backend }})"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        if: steps.filter.outputs.should_run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # Cache Rust build artifacts
      - name: Setup Rust cache
        if: steps.filter.outputs.should_run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.backend }}

      # Linux CUDA setup
      - name: Install CUDA (Linux)
        if: steps.filter.outputs.should_run == 'true' && matrix.backend == 'cuda' && runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'

      # Windows CUDA setup
      - name: Install CUDA (Windows)
        if: steps.filter.outputs.should_run == 'true' && matrix.backend == 'cuda' && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "thrust", "visual_studio_integration"]'

      # Linux dependencies
      - name: Install Linux dependencies
        if: steps.filter.outputs.should_run == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      # macOS dependencies
      - name: Install macOS dependencies
        if: steps.filter.outputs.should_run == 'true' && runner.os == 'macOS'
        run: |
          brew install pkg-config openssl

      # Windows dependencies
      - name: Setup MSVC (Windows)
        if: steps.filter.outputs.should_run == 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Build mistralrs-server with native Cargo
      - name: Build mistralrs-server
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        env:
          # Set CUDA compute capability to avoid nvidia-smi requirement
          # Compute cap 80 = A100/A30, 75 = T4, 70 = V100
          # This supports a wide range of GPUs
          CUDA_COMPUTE_CAP: ${{ matrix.backend == 'cuda' && '80' || '' }}
        run: |
          # Windows: Remove Git from PATH to avoid link.exe conflict
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Original PATH (first 500 chars): ${PATH:0:500}"
            # Filter out Git for Windows directories (/mingw64/bin and /usr/bin contain Git's link.exe)
            NEW_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -E '^/(mingw64|usr)/bin$' | tr '\n' ':' | sed 's/:$//')
            export PATH="$NEW_PATH"
            echo "Cleaned PATH (first 500 chars): ${PATH:0:500}"
            echo "Verifying link.exe location:"
            which link.exe || echo "link.exe not found in PATH (expected - will use MSVC linker)"
          fi

          # Build command based on backend
          if [ -n "${{ matrix.features }}" ]; then
            echo "Building with features: ${{ matrix.features }}"
            cargo build --release --package mistralrs-server --features "${{ matrix.features }}"
          else
            echo "Building with default features (CPU)"
            cargo build --release --package mistralrs-server
          fi

          echo "Build complete"
          ls -lah target/release/

      # Find the built binary
      - name: Find binary path
        if: steps.filter.outputs.should_run == 'true'
        id: find_binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY_PATH="target/release/mistralrs-server.exe"
            BINARY_NAME="mistralrs-server.exe"
          else
            BINARY_PATH="target/release/mistralrs-server"
            BINARY_NAME="mistralrs-server"
          fi

          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: Binary not found at $BINARY_PATH!"
            find target/release -name "mistralrs-server*" || true
            exit 1
          fi

          echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT
          echo "binary_name=$BINARY_NAME" >> $GITHUB_OUTPUT
          echo "Found binary at: $BINARY_PATH"

      # Create release directory structure
      - name: Prepare release archive
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p release

          # Copy binary
          cp "${{ steps.find_binary.outputs.binary_path }}" "release/${{ steps.find_binary.outputs.binary_name }}"

          # For GPU builds (CUDA/ROCm): Copy shared libraries produced by the build
          # Libraries are copied alongside binary (RPATH uses $ORIGIN to find them)
          if [[ "${{ matrix.backend }}" == "cuda" || "${{ matrix.backend }}" == "rocm" ]] && [ "${{ runner.os }}" != "Windows" ]; then
            # Find the build output directory
            BUILD_DIR=$(dirname "${{ steps.find_binary.outputs.binary_path }}")

            # Copy ALL .so files and symlinks from build output to same directory as binary
            echo "Copying shared libraries from $BUILD_DIR to release/"
            find "$BUILD_DIR" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -P {} release/ \;

            # List what we copied
            echo "Packaged shared libraries:"
            ls -lh release/*.so* 2>/dev/null || echo "No .so files found"
          fi

          # Create version file
          echo "mistralrs-server" > release/version.txt
          echo "${{ github.ref_name }}" >> release/version.txt
          echo "Backend: ${{ matrix.backend }}" >> release/version.txt
          echo "Platform: ${{ matrix.platform }}-${{ matrix.arch }}" >> release/version.txt
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> release/version.txt

          # Make executable on Unix
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "release/${{ steps.find_binary.outputs.binary_name }}"
          fi

          echo "Release directory contents:"
          ls -lah release/

      # Create archive
      - name: Create archive
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          # Append version suffix when set (Windows-CUDA matrix has 12.6
          # and 13.0 entries — without the suffix the two upload-artifact
          # names would collide).
          SUFFIX=""
          if [ -n "${{ matrix.version_suffix }}" ]; then
            SUFFIX="${{ matrix.version_suffix }}"
          fi
          ARCHIVE_NAME="mistralrs-server-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.backend }}${SUFFIX}"

          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a "${ARCHIVE_NAME}.zip" ./release/*
            echo "ARCHIVE_FILE=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          else
            tar czf "${ARCHIVE_NAME}.tar.gz" -C release .
            echo "ARCHIVE_FILE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          fi

      # Upload artifacts
      - name: Upload artifact
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARCHIVE_FILE }}
          retention-days: 7

  # Linux CUDA — matrix on two NVIDIA container images. CUDA 13 needs
  # driver >=580; 12.x stays on driver >=525, so we ship both and let
  # the user pick the artifact matching their driver line.
  build-cuda:
    name: Build linux-x86_64-cuda${{ matrix.version_suffix }}
    runs-on: ubuntu-latest
    container: nvidia/cuda:${{ matrix.cuda_version }}-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "12.6.0"
            version_suffix: "12.6"
          - cuda_version: "13.0.0"
            version_suffix: "13.0"
    if: |
      (github.event_name == 'push') ||
      ((inputs.platform == 'all' || inputs.platform == 'linux') &&
       (inputs.backend == 'all' || inputs.backend == 'cuda'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential curl pkg-config libssl-dev python3 python3-dev git

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build mistralrs-server
        run: |
          cargo build --release --package mistralrs-server --features cuda
          echo "Build complete"
          ls -lah target/release/
        env:
          CARGO_TARGET_DIR: target
          CARGO_BUILD_JOBS: 4
          CUDA_COMPUTE_CAP: "80"

      - name: Find binary path
        id: find_binary
        run: |
          BINARY_PATH="target/release/mistralrs-server"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: Binary not found at $BINARY_PATH!"
            find target/release -name "mistralrs-server*" || true
            exit 1
          fi
          echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT
          echo "Found binary at: $BINARY_PATH"

      - name: Prepare release archive
        run: |
          mkdir -p release

          # Copy binary
          cp "${{ steps.find_binary.outputs.binary_path }}" "release/mistralrs-server"

          # Copy shared libraries
          BUILD_DIR=$(dirname "${{ steps.find_binary.outputs.binary_path }}")
          echo "Copying shared libraries from $BUILD_DIR to release/"
          find "$BUILD_DIR" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -P {} release/ \;

          echo "Packaged shared libraries:"
          ls -lh release/*.so* 2>/dev/null || echo "No .so files found"

          # Create version file
          echo "mistralrs-server" > release/version.txt
          echo "${{ github.ref_name }}" >> release/version.txt
          echo "Backend: cuda ${{ matrix.version_suffix }}" >> release/version.txt
          echo "Platform: linux-x86_64" >> release/version.txt
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> release/version.txt

          chmod +x "release/mistralrs-server"

          echo "Release directory contents:"
          ls -lah release/

      - name: Create archive
        run: |
          tar czf "mistralrs-server-linux-x86_64-cuda${{ matrix.version_suffix }}.tar.gz" -C release .
          echo "ARCHIVE_FILE=mistralrs-server-linux-x86_64-cuda${{ matrix.version_suffix }}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistralrs-server-linux-x86_64-cuda${{ matrix.version_suffix }}
          path: ${{ env.ARCHIVE_FILE }}
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-matrix, build-cuda]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -lah release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## mistralrs-server Release ${{ github.ref_name }}

            ### Supported Platforms and Backends

            - **Linux x86_64**: CPU, CUDA 12.6, CUDA 13.0
            - **macOS aarch64**: Metal
            - **Windows x86_64**: CPU, CUDA 12.6, CUDA 13.0

            ### Pick the right CUDA artifact

            | Artifact suffix | Driver / runtime requirement |
            | --- | --- |
            | `-cuda13.0` | Driver ≥ 580, CUDA runtime 13.x. Modern (Turing → Blackwell). |
            | `-cuda12.6` | Driver ≥ 525, CUDA runtime 12.x. Broader compat — covers older driver lines still on 12.x. |

            ### Installation

            1. Download the appropriate archive for your platform and GPU backend
            2. Extract the archive
            3. The `mistralrs-server` binary is ready to use
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
